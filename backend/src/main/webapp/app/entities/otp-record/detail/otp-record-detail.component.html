<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (otpRecord(); as otpRecordRef) {
      <div>
        <h2 data-cy="otpRecordDetailsHeading"><span jhiTranslate="fypApp.otpRecord.detail.title">Otp Record</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ otpRecordRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="fypApp.otpRecord.email">Email</span></dt>
          <dd>
            <span>{{ otpRecordRef.email }}</span>
          </dd>
          <dt><span jhiTranslate="fypApp.otpRecord.otpCode">Otp Code</span></dt>
          <dd>
            <span>{{ otpRecordRef.otpCode }}</span>
          </dd>
          <dt><span jhiTranslate="fypApp.otpRecord.expiryTime">Expiry Time</span></dt>
          <dd>
            <span>{{ otpRecordRef.expiryTime | formatMediumDatetime }}</span>
          </dd>
          <dt><span jhiTranslate="fypApp.otpRecord.verified">Verified</span></dt>
          <dd>
            <span>{{ otpRecordRef.verified }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/otp-record', otpRecordRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
