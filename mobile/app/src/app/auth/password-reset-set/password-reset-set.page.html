<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/auth/password-reset-verify"></ion-back-button>
    </ion-buttons>
    <ion-title>Set a new password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="setPasswordForm" (ngSubmit)="submitNewPassword()">
    <ion-list>
      <ion-item lines="full">
        <ion-label position="floating">New Password</ion-label>
        <ion-input
          formControlName="password"
          [type]="showPassword ? 'text' : 'password'"
          required
        ></ion-input>
        <ion-button fill="clear" (click)="toggleShowPassword()" slot="end">
          <ion-icon
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            slot="icon-only"
          ></ion-icon>
        </ion-button>
      </ion-item>

      <ion-item lines="full">
        <ion-label position="floating">Confirm Password</ion-label>
        <ion-input
          formControlName="confirmPassword"
          [type]="showPassword ? 'text' : 'password'"
          required
        ></ion-input>
      </ion-item>
    </ion-list>

    <ion-text
      color="danger"
      *ngIf="setPasswordForm.errors?.['mismatch'] && setPasswordForm.get('confirmPassword')?.touched"
      class="ion-padding-start"
    >
      <p>The two passwords entered do not match.</p>
    </ion-text>
    <ion-text
      color="danger"
      *ngIf="setPasswordForm.get('password')?.hasError('minlength') && setPasswordForm.get('password')?.touched"
      class="ion-padding-start"
    >
      <p>The password must be at least 8 characters long.</p>
    </ion-text>
    <ion-text color="danger" *ngIf="errorMessage" class="ion-padding-start">
      <p>{{ errorMessage }}</p>
    </ion-text>

    <ion-button
      expand="block"
      type="submit"
      [disabled]="setPasswordForm.invalid || isLoading"
      class="ion-margin-top"
    >
      <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
      <span *ngIf="!isLoading">Confirm and reset password</span>
    </ion-button>
  </form>

  <ion-alert
    header="Reset successful"
    message="Your password has been successfully reset. Please log in using your new password."
    [buttons]="['OK']"
    [isOpen]="isSuccessAlertOpen"
    (didDismiss)="onSuccessAlertDismiss()"
  ></ion-alert>
</ion-content>
