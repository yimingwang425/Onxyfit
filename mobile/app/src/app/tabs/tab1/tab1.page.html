<ion-content [fullscreen]="true">
  
  <div>
    
    <h2 class="ion-padding-start">{{ greeting }}, {{ username }}!</h2>

    <ion-card>
      <ion-card-header>
        <ion-card-title>
          <ion-icon name="sparkles-outline" slot="start" color="primary"></ion-icon>
          AI Coach Tip
        </ion-card-title>
      </ion-card-header>
      <ion-card-content>
        {{ aiTip }}
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-header>
        <ion-card-title>
          <ion-icon name="bar-chart-outline" slot="start" color="tertiary"></ion-icon>
          Weekly Progress
        </ion-card-title>
      </ion-card-header>
      <ion-card-content>
        
        <div class="chart-container">
          <canvas #progressChartCanvas></canvas>
        </div>
        
        <div class="progress-text">
          Workouts Completed: {{ progressData.completed }} / {{ progressData.total }}
        </div>
      </ion-card-content>
    </ion-card>

    <ion-list-header>
      <ion-label>Quick Actions</ion-label>
    </ion-list-header>

    <ion-list [inset]="true">
      <ion-item [button]="true" (click)="logMood()">
        <ion-icon name="sparkles-outline" slot="start" color="secondary"></ion-icon>
        <ion-label>Log Today's Mood</ion-label>
        <ion-text slot="end" color="medium" *ngIf="currentMood">{{ currentMood }}</ion-text>
        <ion-button 
          fill="clear" 
          slot="end" 
          (click)="showMoodInfo(); $event.stopPropagation();">
          <ion-icon name="information-circle-outline" color="medium"></ion-icon>
        </ion-button>
      </ion-item>

      <ion-item [button]="true" (click)="logWater()">
        <ion-icon name="water-outline" slot="start" color="primary"></ion-icon>
        <ion-label>Log Water Intake</ion-label>
        <ion-text slot="end" color="medium" *ngIf="currentWater > 0">{{ currentWater }} glasses</ion-text>
        <ion-button 
          fill="clear" 
          slot="end" 
          (click)="showWaterInfo(); $event.stopPropagation();">
          <ion-icon name="information-circle-outline" color="medium"></ion-icon>
        </ion-button>
      </ion-item>
    </ion-list>

    <ion-list-header>
      <ion-label>More Features</ion-label>
    </ion-list-header>
    <ion-list [inset]="true">
      <ion-item [button]="true" [disabled]="true">
        <ion-label color="medium">X_X</ion-label>
      </ion-item>
      <ion-item [button]="true" [disabled]="true">
        <ion-label color="medium">^_^</ion-label>
      </ion-item>
    </ion-list>

  </div>
  
  <div style="height: 32px;"></div>

</ion-content>
