<ion-header>
  <ion-toolbar>
    <ion-title>Register — Set Password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p>Please set a secure password for your account (minimum 8 characters).</p>

  <form [formGroup]="form" (ngSubmit)="continue()">
    <ion-item>
      <ion-label position="stacked">Password</ion-label>
      <ion-input
        [type]="showPassword ? 'text' : 'password'"
        formControlName="password"
        autocomplete="new-password">
      </ion-input>
    </ion-item>

    <div *ngIf="form.controls['password']?.invalid && form.controls['password']?.touched" style="color: var(--ion-color-danger); margin:8px 0">
      <ion-text *ngIf="form.controls['password']?.errors?.['required']">Password is a required</ion-text>
      <ion-text *ngIf="form.controls['password']?.errors?.['minlength']">The password must be at least 8 characters.</ion-text>
    </div>

    <div style="display:flex; align-items:center; gap:8px; margin:8px 0">
      <ion-button fill="clear" size="small" (click)="toggleShowPassword()">
        {{ showPassword ? 'Hide password' : 'Show password' }}
      </ion-button>
    </div>

    <div *ngIf="error" style="color: var(--ion-color-danger); margin:8px 0">
      <ion-text>{{ error }}</ion-text>
    </div>

    <ion-button expand="block" type="submit" [disabled]="loading">Next step: Confirm your password</ion-button>

    <div *ngIf="loading" style="text-align:center; margin-top:12px">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  </form>
</ion-content>
