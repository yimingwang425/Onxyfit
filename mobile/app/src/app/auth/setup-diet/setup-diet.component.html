<ion-header>
  <ion-toolbar>
    <ion-title>Profile Setup (6/7)</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="wizard-container">
    <div class="prompt-area">
      <ion-label>
        <h2>Any Diet Preference?</h2>
      </ion-label>

      <form [formGroup]="form" (ngSubmit)="next()">
        <ion-item>
          <ion-select formControlName="dietPref" placeholder="Select one">
            <ion-select-option *ngFor="let o of dietOptions" [value]="o.value">
              {{ o.label }}
            </ion-select-option>
          </ion-select>
        </ion-item>
      </form>
    </div>

    <div class="button-area">
      <ion-button fill="clear" (click)="skip()">Skip</ion-button>
      <ion-button [disabled]="form.invalid" (click)="next()">Next</ion-button>
    </div>
  </div>
</ion-content>
