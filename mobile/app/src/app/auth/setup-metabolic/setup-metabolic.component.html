<ion-header>
  <ion-toolbar>
    <ion-title>Profile Setup (7/7)</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="wizard-container">
    <div class="prompt-area">
      <ion-label>
        <h2>Select your Metabolic Profile</h2>
      </ion-label>

      <form [formGroup]="form" (ngSubmit)="next()">
        <ion-item>
          <ion-select formControlName="metabolicProfile" placeholder="Select one">
            <ion-select-option *ngFor="let o of metabolicOptions" [value]="o.value">
              {{ o.label }}
            </ion-select-option>
          </ion-select>
          <ion-button fill="clear" (click)="openMetabolicInfo()" slot="end">
            <ion-icon name="information-circle-outline" color="medium"></ion-icon>
          </ion-button>
        </ion-item>
      </form>
    </div>

    <div class="button-area">
      <ion-button fill="clear" (click)="skip()">Skip</ion-button>
      <ion-button [disabled]="form.invalid" (click)="next()">Finish</ion-button>
    </div>
  </div>
</ion-content>
